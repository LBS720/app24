# Builds the signed Android App Bundle (.aab) for Google Play on a GitHub Linux runner.
# Run it from the Actions tab ("Run workflow"); download the .aab from the run's Artifacts
# and upload it in Play Console. Nothing is installed on Linoy's Mac.
#
# Needs two repository secrets (set from the files in ~/Documents/24-app-android-signing):
#   ANDROID_KEYSTORE_B64       contents of upload-keystore.base64.txt
#   ANDROID_KEYSTORE_PASSWORD  contents of password.txt
name: Android build

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the web app into the Android project
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias upload > /dev/null && echo "keystore and password match"

      - name: Build the release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: hok24-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
