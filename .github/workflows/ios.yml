# Builds the iPhone app on a GitHub macOS runner and uploads it to App Store Connect.
# Run it from the Actions tab ("Run workflow"). Nothing is installed on Linoy's Mac.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions),
# all from App Store Connect > Users and Access > Integrations > App Store Connect API:
#   ASC_KEY_ID      the key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the full contents of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role so Xcode can create the distribution certificate in the cloud.
name: iOS build and upload

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and copy the web app into the iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Show Xcode
        run: xcodebuild -version

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # Rebuilds a clean PEM file however the key was pasted: with or without the BEGIN/END lines,
        # with lost or Windows line breaks, as one long line, or base64 of the whole file.
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"].strip()
          if "BEGIN" not in raw:
              try:
                  dec = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode()
                  if "BEGIN" in dec:
                      raw = dec
              except Exception:
                  pass
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if not body:
              sys.exit("ASC_KEY_P8 is empty or has no key data")
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          print("key file written:", len(body), "base64 characters,", len(lines), "lines")
          PY
          openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" -noout && echo "key parses as a private key"

      - name: Archive for the App Store
        # Archived unsigned on purpose: automatic signing at archive time asks for a development
        # profile, which needs registered devices. The export step signs it for the App Store
        # with a cloud-managed distribution certificate.
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=JGS7CPA5MX \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
